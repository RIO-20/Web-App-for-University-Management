<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>University Management System</title>
    <style>
        /* Shared Styles (Matches your Login Page) */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        /* Hero Section */
        .hero-container {
            background-color: white;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* The Main Action Button */
        .btn-primary {
            display: inline-block;
            background-color: #4CAF50; /* Same Green as Login */
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-primary:hover {
            background-color: #45a049;
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="hero-container">
    <h1>Welcome to UniManage</h1>
    <p>
        The complete solution for managing university faculties, budgets, and administration.
        Secure, fast, and easy to use.
    </p>

    <a href="/login" class="btn-primary">Access Portal</a>
</div>

<div class="footer">
    &copy; 2026 Raul's University Management System
</div>

</body>
</html>
