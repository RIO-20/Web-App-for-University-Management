<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inbox - University Management</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
       
        .main-content { flex: 1; padding: 40px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-bottom: 25px; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; }
        
    
        .message-list { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .message-list th { text-align: left; padding: 12px; background: #f8f9fa; color: #7f8c8d; border-bottom: 2px solid #ecf0f1; }
        .message-list td { padding: 15px 12px; border-bottom: 1px solid #eee; color: #2c3e50; }
        .message-list tr:hover { background-color: #fcfcfc; }
        .sender-badge { background: #3498db; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        
      
        .compose-box { background: #fdfdfd; padding: 20px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #7f8c8d; font-weight: bold; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; font-size: 14px; }
        .btn-send { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-send:hover { background: #219150; }
    </style>
</head>
<body>

    
    <div class="sidebar">
        <div class="sidebar-header">
            UNIV MANAGEMENT
        </div>
        
        <ul class="nav-links">
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/messages" class="active">Send An Email/Inbox</a></li>
            <li><a href="/equipment">Equipment Management</a></li>
            <li><a href="/analysis">Data Analysis</a></li>
            <li><a href="/actions">Actions</a></li>
            <li><a href="/sponsors">Sponsors & Donations</a></li>
            
            <li th:if="${admin != null and admin.username == 'super'}">
                <a href="/console" style="color: white;">Admin Console</a>
            </li>
        </ul>

        <div class="user-profile">
            <span class="user-name" th:text="${admin.nume} + ' ' + ${admin.prenume}">Admin Name</span>
            <span class="user-role">Administrator</span>
        </div>
    </div>

 
    <div class="main-content">
      
        <div class="top-bar" style="display: flex; justify-content: flex-end; padding-bottom: 20px;">
             <a href="/login" class="logout-btn" style="background: #e74c3c; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px;">Logout</a>
        </div>

        <div class="container">
            <h2><i class="fas fa-envelope-open-text"></i> Messages</h2>

          
            <div class="compose-box">
                <h3 style="margin-top: 0; color: #34495e;">Compose New Message</h3>
                <form action="/messages/send" method="post">
                    <div class="form-group">
                        <label>To:</label>
                        <select name="receiverEmail" class="form-control" required>
                            <option value="">Select Recipient</option>
                            <option th:each="email : ${contacts}" th:value="${email}" th:text="${email}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Subject:</label>
                        <input type="text" name="subject" class="form-control" placeholder="Enter subject..." required>
                    </div>
                    <div class="form-group">
                        <label>Message:</label>
                        <textarea name="content" rows="4" class="form-control" placeholder="Type your message here..." required></textarea>
                    </div>
                    <button type="submit" class="btn-send"><i class="fas fa-paper-plane"></i> Send Message</button>
                </form>
            </div>

           
            <h3 style="color: #34495e; margin-top: 40px;">Received Messages</h3>
            <div th:if="${#lists.isEmpty(inbox)}" style="text-align: center; color: #95a5a6; padding: 20px;">
                <i class="fas fa-inbox" style="font-size: 40px; margin-bottom: 10px;"></i>
                <p>No messages in your inbox.</p>
            </div>
            
            <table class="message-list" th:if="${not #lists.isEmpty(inbox)}">
                <thead>
                    <tr>
                        <th style="width: 20%;">From</th>
                        <th style="width: 30%;">Subject</th>
                        <th>Content</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="msg : ${inbox}">
                        <td><span class="sender-badge" th:text="${msg.senderName}"></span></td>
                        <td th:text="${msg.subject}" style="font-weight: bold;"></td>
                        <td th:text="${msg.content}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
